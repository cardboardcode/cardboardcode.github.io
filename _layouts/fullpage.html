<!DOCTYPE html>
<html>
  {% seo %}
  {%- include head.html -%}

  <head>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }
      #game-root {
        position: fixed;
        inset: 0;
      }
      #game-root canvas {
        display: block;
      }
      #menu {
        position: fixed;
        left: 50%;
        bottom: 8vh;
        transform: translateX(-50%);
        display: flex;
        gap: 24px;
        z-index: 10;
      }
      #menu button {
        appearance: none;
        border: 1px solid #3c3f4a;
        background: #15161d;
        color: #dde0ea;
        font: 500 1rem/1 inherit;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 14px 42px;
        border-radius: 999px;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
      }
      #menu button:hover {
        border-color: #7a81a0;
        background: #1d1f2a;
      }
      #menu button:active {
        background: #232534;
      }
      #void-msg {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #9aa3b8;
        font-size: 1.25rem;
        font-weight: 400;
        letter-spacing: 0.18em;
        text-transform: none;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.5s ease;
        z-index: 20;
        animation: void-float 7s ease-in-out infinite;
      }
      #void-msg.show {
        opacity: 1;
      }
      @keyframes void-float {
        0%, 100% { margin: 0 0; }
        25% { margin: -22px 14px; }
        50% { margin: 10px -18px; }
        75% { margin: 22px 10px; }
      }
    </style>
  </head>

  <body>
    <div id="game-root"></div>

    <div id="menu" role="group" aria-label="Door menu">
      <button id="btn-enter" type="button">Enter</button>
    </div>

    <div id="void-msg" aria-live="polite">It is not ready. Come back later.</div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script>
    (function () {
      if (typeof THREE === 'undefined') {
        document.getElementById('game-root').textContent = 'Failed to load the 3D engine.';
        return;
      }

      var root = document.getElementById('game-root');

      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.Fog(0x000000, 8, 18);

      var camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 1.3, 6.2);
      camera.lookAt(0, 1.0, 0);

      var renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      root.appendChild(renderer.domElement);

      // Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.35));
      var key = new THREE.DirectionalLight(0xbfd0ff, 1.1);
      key.position.set(2, 4, 5);
      scene.add(key);
      var rim = new THREE.PointLight(0x445588, 1.2, 20);
      rim.position.set(-3, 2, 3);
      scene.add(rim);

      // Floor
      var floor = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.MeshBasicMaterial({ color: 0x000000 })
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Door group
      var doorGroup = new THREE.Group();
      scene.add(doorGroup);

      var frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2d38, roughness: 0.7, metalness: 0.2 });
      var slabMat  = new THREE.MeshStandardMaterial({ color: 0x5a6584, roughness: 0.55, metalness: 0.35 });
      var handleMat = new THREE.MeshStandardMaterial({ color: 0xc9cede, roughness: 0.25, metalness: 0.9 });

      var W = 1.6, H = 3.0, T = 0.18; // door slab dims

      // Frame: two uprights + lintel, slightly proud of the slab
      var frameUpT = new THREE.Mesh(new THREE.BoxGeometry(0.22, H + 0.22, 0.34), frameMat);
      frameUpT.position.set(-(W / 2 + 0.11), (H + 0.22) / 2, 0);
      var frameUpR = frameUpT.clone();
      frameUpR.position.x = W / 2 + 0.11;
      var frameLintel = new THREE.Mesh(new THREE.BoxGeometry(W + 0.44, 0.22, 0.34), frameMat);
      frameLintel.position.set(0, H + 0.11, 0);
      doorGroup.add(frameUpT, frameUpR, frameLintel);

      // Slab (hinged at left edge)
      var slabPivot = new THREE.Group();
      slabPivot.position.set(-W / 2, 0, 0);
      var slab = new THREE.Mesh(new THREE.BoxGeometry(W, H, T), slabMat);
      slab.position.set(W / 2, H / 2, 0);
      slabPivot.add(slab);

      // Handle on right edge of the slab
      var handle = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.42, 16), handleMat);
      handle.rotation.x = Math.PI / 2;
      handle.position.set(W - 0.28, H / 2, T / 2 + 0.05);
      slabPivot.add(handle);

      doorGroup.add(slabPivot);

      // Menu overlay fades out when entering
      var menu = document.getElementById('menu');

      // Door state
      var state = 'idle'; // 'idle' | 'opening' | 'entered'
      var doorAngle = 0;
      var DOOR_OPEN = -Math.PI * 0.65; // fully open angle
      var OPEN_DURATION = 1.2;   // seconds
      var ZOOM_DURATION = 1.4;   // seconds
      var MSG_DELAY = 3.0;       // seconds after the pan completes
      var openT = 0;
      var zoomT = 0;
      var msgShown = false;
      var voidMsg = document.getElementById('void-msg');
      var camStart = { x: 0, y: 1.3, z: 6.2 };
      var camLook = { x: 0, y: 1.0, z: 0 };

      function easeInOut(t) {
        return t < 0.5 ? t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      document.getElementById('btn-enter').addEventListener('click', function () {
        if (state !== 'idle') return;
        state = 'opening';
        menu.style.transition = 'opacity 0.4s';
        menu.style.opacity = '0';
        menu.style.pointerEvents = 'none';
      });

      // Idle: breathing rim light. On "enter": door swings open, then camera zooms into the void.
      var clock = new THREE.Clock();
      var last = clock.getElapsedTime();
      function tick() {
        requestAnimationFrame(tick);
        var t = clock.getElapsedTime();
        var dt = Math.min(t - last, 0.1);
        last = t;

        if (state === 'opening') {
          openT += dt;
          var p = easeInOut(Math.min(openT / OPEN_DURATION, 1));
          doorAngle = DOOR_OPEN * p;
          slabPivot.rotation.y = doorAngle;
          if (p >= 1) state = 'entered';
        } else if (state === 'entered') {
          zoomT += dt;
          var z = easeInOut(Math.min(zoomT / ZOOM_DURATION, 1));
          camera.position.set(
            camStart.x,
            camStart.y - z * 0.3,
            camStart.z - z * (camStart.z - 0.3)
          );
          camera.lookAt(camLook.x, camLook.y, 0);
          if (!msgShown && zoomT >= ZOOM_DURATION + MSG_DELAY) {
            msgShown = true;
            voidMsg.classList.add('show');
          }
        }

        rim.intensity = 1.2 + Math.sin(t * 0.8) * 0.25;
        renderer.render(scene, camera);
      }
      tick();

      addEventListener('resize', function () {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    })();
    </script>
  </body>
</html>
