<!DOCTYPE html>
<html>
  {% seo %}
  {%- include head.html -%}

  <head>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }
      #game-root {
        position: fixed;
        inset: 0;
      }
      #game-root canvas {
        display: block;
      }
      #menu {
        position: fixed;
        left: 50%;
        bottom: 8vh;
        transform: translateX(-50%);
        display: flex;
        gap: 24px;
        z-index: 10;
      }
      #menu button {
        appearance: none;
        border: 1px solid #3c3f4a;
        background: #15161d;
        color: #dde0ea;
        font: 500 1rem/1 inherit;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 14px 42px;
        border-radius: 999px;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
      }
      #menu button:hover {
        border-color: #7a81a0;
        background: #1d1f2a;
      }
      #menu button:active {
        background: #232534;
      }
      #void-msg {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #9aa3b8;
        font-size: 1.25rem;
        font-weight: 400;
        letter-spacing: 0.18em;
        text-transform: none;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.5s ease;
        z-index: 20;
        animation: void-float 7s ease-in-out infinite;
      }
      #void-msg.show {
        opacity: 1;
      }
      @keyframes void-float {
        0%, 100% { margin: 0 0; }
        25% { margin: -22px 14px; }
        50% { margin: 10px -18px; }
        75% { margin: 22px 10px; }
      }
    </style>
  </head>

  <body>
    <div id="game-root"></div>

    <div id="menu" role="group" aria-label="Door menu">
      <button id="btn-enter" type="button">Enter</button>
    </div>

    <div id="void-msg" aria-live="polite">It is not ready. Come back later.</div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script>
    (function () {
      if (typeof THREE === 'undefined') {
        document.getElementById('game-root').textContent = 'Failed to load the 3D engine.';
        return;
      }

      var root = document.getElementById('game-root');

      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.Fog(0x000000, 8, 18);

      var camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 1.3, 6.2);
      camera.lookAt(0, 1.0, 0);

      var renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      root.appendChild(renderer.domElement);

      // Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.35));
      var key = new THREE.DirectionalLight(0xbfd0ff, 1.1);
      key.position.set(2, 4, 5);
      scene.add(key);
      var rim = new THREE.PointLight(0x445588, 1.2, 20);
      rim.position.set(-3, 2, 3);
      scene.add(rim);

      // Floor
      var floor = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.MeshBasicMaterial({ color: 0x000000 })
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Door group
      var doorGroup = new THREE.Group();
      scene.add(doorGroup);

      // ─────────────────────────────────────────────────────────────────────────
      // DOOR ART — to change the door image later, either:
      //   1. replace the PNG at the path below (no code edit), or
      //   2. point this constant at any other image URL (same-origin or https).
      // A load failure silently falls back to the flat slab color — the door
      // still works, the art just doesn't appear.
      // ─────────────────────────────────────────────────────────────────────────
      var DOOR_ART_URL = 'img/door/patch-art.png';   // ← ONE-LINE SWAP POINT
      var DOOR_ART_MARGIN = 0.04;  // fraction of slab size kept clear around art

      var frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2d38, roughness: 0.7, metalness: 0.2 });
      var slabMat  = new THREE.MeshStandardMaterial({ color: 0x5a6584, roughness: 0.55, metalness: 0.35 });
      var handleMat = new THREE.MeshStandardMaterial({ color: 0xc9cede, roughness: 0.25, metalness: 0.9 });

      var W = 1.6, H = 3.0, T = 0.18; // door slab dims

      // Frame: two uprights + lintel, slightly proud of the slab
      var frameUpT = new THREE.Mesh(new THREE.BoxGeometry(0.22, H + 0.22, 0.34), frameMat);
      frameUpT.position.set(-(W / 2 + 0.11), (H + 0.22) / 2, 0);
      var frameUpR = frameUpT.clone();
      frameUpR.position.x = W / 2 + 0.11;
      var frameLintel = new THREE.Mesh(new THREE.BoxGeometry(W + 0.44, 0.22, 0.34), frameMat);
      frameLintel.position.set(0, H + 0.11, 0);
      doorGroup.add(frameUpT, frameUpR, frameLintel);

      // Slab (hinged at left edge)
      var slabPivot = new THREE.Group();
      slabPivot.position.set(-W / 2, 0, 0);
      var slab = new THREE.Mesh(new THREE.BoxGeometry(W, H, T), slabMat);
      slab.position.set(W / 2, H / 2, 0);
      slabPivot.add(slab);

      // Handle on right edge of the slab
      var handle = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.42, 16), handleMat);
      handle.rotation.x = Math.PI / 2;
      handle.position.set(W - 0.28, H / 2, T / 2 + 0.05);
      slabPivot.add(handle);

      // ── Door art (transparent, contain-fitted, centered on the slab face) ──
      // Loaded async; a 1×1 placeholder is swapped to the true size in the
      // on-load callback. On failure it stays invisible — the slab's flat color
      // shows (graceful fallback: door, frame, handle, animation all unchanged).
      //
      // Swap: overwrite img/door/patch-art.png (any PNG with transparent
      // background), or point DOOR_ART_URL at a new image. Aspect is read at
      // runtime — the art is contain-fitted to the slab no matter the aspect.

      var artMaxW = W * (1 - DOOR_ART_MARGIN);   // 0.92 * 1.6
      var artMaxH = H * (1 - DOOR_ART_MARGIN);   // 0.92 * 3.0
      var art = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),            // re-sized in onLoad
        new THREE.MeshStandardMaterial({
          transparent: true,
          alphaTest: 0.05,                        // kills sorting shimmer vs slab
          roughness: 0.6,
          metalness: 0.1
        })
      );
      art.visible = false;                        // flipped true when the texture is ready
      art.position.set(W / 2, H / 2, T / 2 + 0.005); // centered on slab face, 5mm proud

      function applyDoorArt(texture) {
        texture.colorSpace = THREE.SRGBColorSpace; // correct color in r160
        var aspect = texture.image.width / texture.image.height;
        var targetAspect = artMaxW / artMaxH;
        var w, h;
        if (aspect > targetAspect) { w = artMaxW; h = artMaxW / aspect; }
        else                       { h = artMaxH; w = artMaxH * aspect; }
        art.geometry.dispose();
        art.geometry = new THREE.PlaneGeometry(w, h);
        art.material.map = texture;
        art.visible = true;
      }

      new THREE.TextureLoader().load(
        DOOR_ART_URL,
        applyDoorArt,
        undefined,
        function (err) {
          art.visible = false;
          console.warn('[door-art] failed to load', DOOR_ART_URL, err);
        }
      );
      slabPivot.add(art);

      doorGroup.add(slabPivot);

      // Menu overlay fades out when entering
      var menu = document.getElementById('menu');

      // Animation clock. Per-frame advance is capped at 1/30s of animation
      // time so a browser hitch can't deliver a forward leap.
      //
      // The critical fix: easeInOut below is now CONTINUOUS — the original
      // had a 2x value jump at t=0.5 (0.25 on the left side, 0.50 on the
      // right side), which is what you saw as "leaped forward in time" at
      // the two transition points.
      var DOOR_OPEN = -Math.PI * 0.65;
      var OPEN_DURATION = 1.5;
      var ZOOM_DURATION = 1.8;
      var MSG_DELAY = 3.0;
      var MAX_DT = 1 / 30;

      var phase = 'idle';
      var openE = 0;
      var enteredE = 0;
      var msgShown = false;
      var voidMsg = document.getElementById('void-msg');
      var camStart = { x: 0, y: 1.3, z: 6.2 };
      var camLook = { x: 0, y: 1.0, z: 0 };
      var prevT = null;

      // Smoothstep: 3t^2 - 2t^3. Continuous value AND C1 continuous slope.
      // Velocity is 0 at t=0 and t=1 (graceful start/stop), max at t=0.5.
      // No discontinuity anywhere in (0,1).
      function easeInOut(t) {
        if (t <= 0) return 0;
        if (t >= 1) return 1;
        return t * t * (3 - 2 * t);
      }

      document.getElementById('btn-enter').addEventListener('click', function () {
        if (phase !== 'idle') return;
        phase = 'opening';
        prevT = null;
        menu.style.transition = 'opacity 0.4s';
        menu.style.opacity = '0';
        menu.style.pointerEvents = 'none';
      });

      var clock = new THREE.Clock();
      function tick() {
        requestAnimationFrame(tick);
        var now = clock.getElapsedTime();
        if (prevT === null) { prevT = now; }
        var dt = now - prevT;
        prevT = now;
        if (dt < 0) dt = 0;
        if (dt > MAX_DT) dt = MAX_DT;

        if (phase === 'opening') {
          openE = Math.min(openE + dt, OPEN_DURATION);
          slabPivot.rotation.y = DOOR_OPEN * easeInOut(openE / OPEN_DURATION);
          if (openE >= OPEN_DURATION) { phase = 'entered'; }
        } else if (phase === 'entered') {
          enteredE += dt;                                    // grows unbounded, for the MSG_DELAY
          var zoomE = Math.min(enteredE, ZOOM_DURATION);     // clamped for the camera math
          var z = easeInOut(zoomE / ZOOM_DURATION);
          camera.position.set(
            camStart.x,
            camStart.y - z * 0.3,
            camStart.z - z * (camStart.z - 0.3)
          );
          camera.lookAt(camLook.x, camLook.y, 0);
        }

        if (!msgShown && phase === 'entered' && enteredE >= ZOOM_DURATION + MSG_DELAY) {
          msgShown = true;
          voidMsg.classList.add('show');
        }

        renderer.render(scene, camera);
      }
      tick();

      addEventListener('resize', function () {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    })();
    </script>
  </body>
</html>
